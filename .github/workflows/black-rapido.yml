name: Black rápido

# A cada 20 minutos, ativo somente entre 2026-11-27 e 2026-12-01 (horário de Brasília).
# Baixa apenas pedidos das últimas 48h e insights do Meta de hoje e de ontem, e grava a aba Black.
on:
  schedule:
    - cron: '*/20 * * * *'
  repository_dispatch:
    types: [black-rapido]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: black-rapido
  cancel-in-progress: false

jobs:
  black-rapido:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Instalar o Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar as bibliotecas
        run: pip install -r requirements.txt

      - name: Recuperar somente o envelope criptografado
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: dados/cache-publico/api.aes256
          key: dados-api-aes256-v1-black-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dados-api-aes256-v1-

      - name: Autenticar e descriptografar cache (dados/api só no runner)
        env:
          CACHE_KEY: ${{ secrets.CACHE_KEY }}
        run: python -m painel_monstro.cache_seguro restaurar

      - name: Rodar Black rápido (pedidos 48h, Meta Ads, aba Black)
        timeout-minutes: 6
        env:
          PYTHONUNBUFFERED: '1'
          NUVEMSHOP_STORE_ID: ${{ secrets.NUVEMSHOP_STORE_ID }}
          NUVEMSHOP_TOKEN: ${{ secrets.NUVEMSHOP_TOKEN }}
          NUVEMSHOP_USER_AGENT: ${{ secrets.NUVEMSHOP_USER_AGENT }}
          PLANILHA_ID: ${{ secrets.PLANILHA_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_ADS_ACCOUNT_ID: ${{ secrets.META_ADS_ACCOUNT_ID }}
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
          META_ADS_API_VERSION: ${{ vars.META_ADS_API_VERSION || 'v24.0' }}
        run: python -m painel_monstro.rotina --black-rapido

      - name: Criptografar dados antes de guardar
        id: cache_seguro
        if: ${{ always() }}
        env:
          CACHE_KEY: ${{ secrets.CACHE_KEY }}
        run: python -m painel_monstro.cache_seguro guardar

      - name: Guardar somente cache criptografado
        if: ${{ always() && steps.cache_seguro.outputs.pronto == 'sim' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: dados/cache-publico/api.aes256
          key: dados-api-aes256-v1-black-${{ github.run_id }}-${{ github.run_attempt }}
